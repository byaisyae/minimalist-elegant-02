<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <!-- ====== UBAH PER PESANAN: judul, deskripsi, url & gambar pratinjau link (dibaca WhatsApp/medsos, tidak bisa dari config.js) ====== -->
    <title>The Wedding of Nadia &amp; Raka</title>
    <meta property="og:title" content="The Wedding of Nadia &amp; Raka" />
    <meta
      property="og:description"
      content="Kami mengundang Anda untuk hadir di hari bahagia kami. Sabtu, 12 Desember 2026."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://saevitation.com/wedding-nadia-raka/"
    />
    <meta
      property="og:image"
      content="https://saevitation.com/wedding-nadia-raka/img/og.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- logo fav icon -->
    <link rel="icon" type="image/x-icon" href="/img/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="scripts/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body
    class="lock bg-cream-100 text-ink-700 font-sans antialiased overflow-x-hidden"
  >
    <section
      id="cover"
      class="fixed inset-0 z-[60] grid place-items-center text-center px-6 overflow-hidden bg-cream-200"
    >
      <div id="cvbg" class="absolute inset-0 bg kb"></div>
      <div
        class="absolute inset-x-0 bottom-0 h-[40%] bg-gradient-to-t from-cream-100 via-cream-100/70 to-transparent"
      ></div>
      <div
        class="absolute inset-4 sm:inset-8 border border-white/50 rounded-[2rem] pointer-events-none"
      ></div>
      <div class="relative">
        <p
          class="font-sans uppercase tracking-[.3em] text-[11px] sm:text-xs text-white [text-shadow:0_2px_14px_rgba(0,0,0,.45)]"
        >
          THE BEGINNING OF FOREVER
        </p>
        <h1
          data-names
          class="font-serif font-normal text-5xl sm:text-7xl lg:text-6xl text-white my-5 [text-shadow:0_2px_14px_rgba(0,0,0,.45)]"
        ></h1>
        <p
          id="coverDate"
          class="font-sans uppercase tracking-[.3em] text-[11px] sm:text-xs text-white [text-shadow:0_2px_14px_rgba(0,0,0,.45)]"
        ></p>
        <div
          class="mt-10 mx-auto max-w-xs rounded-2xl bg-cream-50/70 backdrop-blur-sm border border-ac/20 py-5 px-4"
        >
          <p class="text-xs text-ink-500">Kepada Yth. Bapak/Ibu/Saudara/i</p>
          <p id="guest" class="font-serif text-2xl text-ink-900 mt-1"></p>
        </div>
        <button
          id="openBtn"
          class="mt-8 px-9 py-3 rounded-full bg-ac text-white font-semibold shadow-lg hover:bg-ac-dark hover:scale-105 transition"
        >
          Buka Undangan
        </button>
      </div>
    </section>

    <div
      id="pg"
      class="hidden fixed top-0 h-1 bg-ac z-[65]"
      style="transform: scaleX(0)"
    ></div>
    <aside
      id="side"
      class="hidden lg:block fixed inset-y-0 left-0 z-0 overflow-hidden"
      style="right: var(--w)"
    >
      <div
        class="sl absolute inset-0 bg kb"
        data-k="cover"
        style="opacity: 1"
      ></div>
      <div
        class="sl absolute inset-0 bg kb"
        data-k="date"
        style="opacity: 0"
      ></div>
      <div
        class="sl absolute inset-0 bg kb"
        data-k="quote"
        style="opacity: 0"
      ></div>
      <div
        class="sl absolute inset-0 bg kb"
        data-k="foot"
        style="opacity: 0"
      ></div>
      <div
        class="absolute inset-x-0 bottom-0 h-[40%] bg-gradient-to-t from-cream-100 via-cream-100/70 to-transparent"
      ></div>
      <div class="absolute bottom-16 left-14 text-ink-900">
        <p class="tracking-[.35em] text-xs">THE WEDDING OF</p>
        <h2 data-names class="font-serif text-6xl xl:text-7xl my-4"></h2>
        <p id="sideDate" class="tracking-widest text-sm"></p>
      </div>
    </aside>
    <audio id="bgm" loop preload="auto"></audio>
    <button
      id="mb"
      class="hidden fixed top-5 right-4 z-40 w-11 h-11 rounded-full bg-white/80 backdrop-blur-md border border-ac/40 text-ink-700 text-lg shadow-lg grid place-items-center"
      aria-label="Musik"
    ></button>
    <main id="app"></main>
    <nav
      id="nav"
      class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 hidden max-w-[94vw] overflow-x-auto no-scrollbar rounded-full bg-cream-50/90 backdrop-blur-md border border-ac/30 px-2 py-1.5 text-[11px] sm:text-xs shadow-xl whitespace-nowrap"
    ></nav>
    <div
      id="lb"
      class="fixed inset-0 z-[70] hidden place-items-center bg-cream-50/95 select-none"
    >
      <button
        id="lbx"
        class="absolute top-4 right-5 text-4xl text-ink-900 z-10"
        aria-label="Tutup"
      >
        &times;
      </button>
      <button
        id="lbp"
        class="absolute left-3 sm:left-8 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-ink-900/10 text-ink-900 text-3xl leading-none hover:bg-ink-900/20 transition"
        aria-label="Sebelumnya"
      >
        &#8249;
      </button>
      <button
        id="lbn"
        class="absolute right-3 sm:right-8 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-ink-900/10 text-ink-900 text-3xl leading-none hover:bg-ink-900/20 transition"
        aria-label="Berikutnya"
      >
        &#8250;
      </button>
      <img
        id="lbi"
        class="max-h-[78vh] max-w-[88vw] rounded-2xl shadow-2xl transition-all duration-200"
        alt=""
      />
      <div id="lbd" class="absolute bottom-6 flex gap-2"></div>
    </div>

    <script src="scripts/config.js"></script>
    <script src="scripts/helpers.js"></script>
    <script src="scripts/render.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/rsvp.js"></script>
    <script src="scripts/gallery.js"></script>
    <script src="scripts/slider.js"></script>
    <script src="scripts/animations.js"></script>
  </body>
</html>
